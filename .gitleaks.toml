# gitleaks の設定（Requirement 15.3）
# 既定のルール（API キー、トークン、秘密鍵など）に、電話番号とメールアドレスのルールを足す。
# テストでは固定のダミー値だけを使い、それを下の許可リストに登録する。
#
# ローカルでの実行（gitleaks v8.25 以上が必要）:
#   npm run secret-scan          # リポジトリの履歴全体
#   npm run secret-scan:staged   # コミット前のステージ済みの変更
title = "hachioji-gov gitleaks config"
minVersion = "v8.25.0"

[extend]
useDefault = true

[[rules]]
id = "jp-phone-number"
description = "日本の電話番号（固定・携帯）"
regex = '''(?:^|[^0-9A-Za-z-])(0\d{1,4}-\d{1,4}-\d{3,4}|0[789]0\d{8})(?:[^0-9A-Za-z-]|$)'''
secretGroup = 1
tags = ["pii", "phone"]

[[rules]]
id = "email-address"
description = "メールアドレス"
# ドメインの各ラベルは英数字で始まり英数字で終わる（`a@-x.com` のような、検証テスト用の
# 不正な形式は対象外にする）
regex = '''[A-Za-z0-9._%+-]+@[A-Za-z0-9](?:[A-Za-z0-9-]*[A-Za-z0-9])?(?:\.[A-Za-z0-9](?:[A-Za-z0-9-]*[A-Za-z0-9])?)*\.[A-Za-z]{2,}'''
tags = ["pii", "email"]

  # 依存パッケージのロックファイルに含まれる作者のアドレスは対象外
  [[rules.allowlists]]
  description = "lockfiles"
  paths = ['''(?:^|/)package-lock\.json$''']

[[allowlists]]
description = "テスト用の固定ダミー値"
regexTarget = "match"
regexes = [
  # 予約済みドメイン（RFC 2606）のメールアドレス
  '''@example\.(?:com|jp|org|net)\b''',
  # 0 で埋めた電話番号（例: 090-0000-0000、09000000000、042-000-0000）
  '''(?:^|[^0-9])0\d{1,3}-?0{3,4}-?0{4}(?:[^0-9]|$)''',
  # Firebase Emulator 専用のダミーの認証情報
  '''dummy-password-for-emulator''',
  '''fake-api-key''',
]
